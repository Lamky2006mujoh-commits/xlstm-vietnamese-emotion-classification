# Validation-only two-block capacity pilot. This configuration is not frozen
# for final test evaluation because seed-42 validation showed early overfitting.
task_id: uit_vsmec_7label
experiment_group: pilot_xlstm_1block_128_v1

data:
  dataset: UIT-VSMEC
  raw_dir: data/raw/uit_vsmec
  preprocessing: light
  max_len: 80
  min_token_frequency: 2

training:
  batch_size: 32
  epochs: 20
  patience: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  selection_metric: weighted_f1
  num_workers: 0
  seeds: [42]

model:
  type: xlstm_native
  backend: native_pytorch_mlstm
  embedding_dim: 128
  num_blocks: 1
  num_heads: 4
  proj_factor: 2.0
  qkv_proj_blocksize: 4
  conv1d_kernel_size: 4
  pooling: last_valid
  dropout: 0.3

