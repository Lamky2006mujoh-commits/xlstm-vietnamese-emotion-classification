task_id: uit_vsmec_7label
experiment_group: final_v1

data:
  dataset: UIT-VSMEC
  raw_dir: data/raw/uit_vsmec
  preprocessing: light
  max_len: 80
  min_token_frequency: 2

training:
  batch_size: 64
  epochs: 1
  patience: 1
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 1.0
  selection_metric: weighted_f1
  num_workers: 0
  seeds: [42]

model:
  type: classical_svm
  embedding_dim: 128
  dropout: 0.0

classical:
  model_name: best_svm_word_char_tfidf
  c_values: [0.25, 0.5, 1.0, 2.0, 4.0]
  class_weight: balanced
  loss: hinge
  word_ngram_range: [1, 3]
  word_min_df: 2
  word_max_features: 50000
  char_ngram_range: [1, 7]
  char_min_df: 2
  char_max_features: 80000
